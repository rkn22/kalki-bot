name: KALKI V8 GEMINI 3.8 FINAL
on:
  schedule:
        - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
            - run: |
          pip install --upgrade pip
          pip install yfinance requests python-telegram-bot pytz
            - run: python kalki_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYMBOL: NIFTY
