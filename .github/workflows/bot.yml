name: Kalki V14.4
on:
  schedule:
    - cron: '0 4 * * 1-5'
    - cron: '30 4 * * 1-5'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - name: Run Kalki
        run: |
          echo "Finding kalki.py..."
          ls -R
          FILE=$(find . -name "kalki.py" | head -n 1)
          echo "Found: $FILE"
          python "$FILE"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
