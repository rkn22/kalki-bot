name: KALKI V14.1 Bot
on:
  schedule:
    - cron: '00 4 * * 1-5'  # 09:30 IST
    - cron: '15 4 * * 1-5'  # 09:45 IST
    - cron: '30 4 * * 1-5'  # 10:00 IST
    - cron: '00 5 * * 1-5'  # 10:30 IST
    - cron: '30 5 * * 1-5'  # 11:00 IST
    - cron: '00 6 * * 1-5'  # 11:30 IST
    - cron: '30 6 * * 1-5'  # 12:00 IST
    - cron: '00 7 * * 1-5'  # 12:30 IST
    - cron: '30 7 * * 1-5'  # 13:00 IST
    - cron: '00 8 * * 1-5'  # 13:30 IST
    - cron: '30 8 * * 1-5'  # 14:00 IST
    - cron: '00 9 * * 1-5'  # 14:30 IST
    - cron: '30 9 * * 1-5'  # 15:00 IST
    - cron: '00 10 * * 1-5' # 15:30 IST
  workflow_dispatch:

jobs:
  run-kalki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python kalki_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
