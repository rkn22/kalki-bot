name: Kalki 14.4 Bot

on:
  schedule:
    - cron: '45 3 * * 1-5'  # 09:15 AM IST
    - cron: '30 4 * * 1-5'  # 10:00 AM IST
    - cron: '15 5 * * 1-5'  # 10:45 AM IST
    - cron: '0 6 * * 1-5'   # 11:30 AM IST
    - cron: '45 6 * * 1-5'  # 12:15 PM IST
    - cron: '30 7 * * 1-5'  # 01:00 PM IST
    - cron: '15 8 * * 1-5'  # 01:45 PM IST
    - cron: '0 9 * * 1-5'   # 02:30 PM IST
    - cron: '45 9 * * 1-5'  # 03:15 PM IST - IMPORTANT
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install requests
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
