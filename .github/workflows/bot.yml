name: KALKI V9 Bot
on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: true
        default: 'LIVE'
        type: choice
        options:
          - LIVE
          - TEST

jobs:
  run-kalki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests pytz --quiet
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python kalki_bot.py
