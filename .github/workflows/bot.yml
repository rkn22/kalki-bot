name: Kalki V14.1
on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00 SILENT
    - cron: '0,30 4-9 * * 1-5' # 9:30 - 3:00 CALLS
    - cron: '0 10 * * 1-5'   # 3:30 CALL
    - cron: '15 10 * * 1-5'  # 3:45 P/L REPORT
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      - run: pip install requests
      - run: python kalki_bot.py
