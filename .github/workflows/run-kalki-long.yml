name: Kalki 9AM PreMarket
on:
  schedule:
    - cron: '30 3 * * 1-5'  # 9:00 AM IST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run Bot + Master 2-Way
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c 'import json; json.dump({"acc":75,"accuracy":75,"pat":"PreMarket","pattern":"PreMarket","price":25220,"nifty_price":25220,"bank_price":57200,"vix":13.2,"time":"09:00:00","bot_signal":"WAIT","signal":"WAIT"}, open("data.json","w"))'
          python bot.py &
          sleep 25
          python master_live.py
